substitutions:
  _REGION: southamerica-east1
  _AR_REPO: fpsi
  _SERVICE: fpsi
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    secretEnv:
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_APP_URL
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}"
        docker build \
          -f deploy/gcp/Dockerfile \
          --build-arg "NEXT_PUBLIC_SUPABASE_URL=$$NEXT_PUBLIC_SUPABASE_URL" \
          --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          --build-arg "NEXT_PUBLIC_APP_URL=$$NEXT_PUBLIC_APP_URL" \
          -t "$$IMAGE:$BUILD_ID" \
          -t "$$IMAGE:latest" \
          .
        docker push "$$IMAGE:$BUILD_ID"
        docker push "$$IMAGE:latest"
    env:
      - _REGION=${_REGION}
      - _AR_REPO=${_AR_REPO}
      - _SERVICE=${_SERVICE}
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/fpsi-next-public-supabase-url/versions/latest
      env: NEXT_PUBLIC_SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/fpsi-next-public-supabase-anon-key/versions/latest
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/fpsi-next-public-app-url/versions/latest
      env: NEXT_PUBLIC_APP_URL
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY